[pytest]
testpaths =
    python/gaussfit_rs/tests
# Figure tests need --mpl and a pinned matplotlib; see the tox "figure" factor.
addopts = -m "not mpl_image_compare"
mpl-results-path = figure_test_images
mpl-use-full-test-name = true
markers =
    mpl_image_compare: hash-verified matplotlib figure test, applied by gaussfit_rs.tests.helpers.figure_test
filterwarnings =
    error
