[pytest]
testpaths =
    python/gaussfit_rs
    docs
doctest_plus = enabled
doctest_optionflags =
    NORMALIZE_WHITESPACE
    FLOAT_CMP
    ELLIPSIS
# Figure tests need --mpl and a pinned matplotlib; see the tox "figure" factor.
addopts = --doctest-rst -m "not mpl_image_compare"
mpl-results-path = figure_test_images
mpl-use-full-test-name = true
markers =
    mpl_image_compare: hash-verified matplotlib figure test, applied by gaussfit_rs.tests.helpers.figure_test
filterwarnings =
    error
    # pytest-mpl warns at startup that the CircleCI job generating reference images ignores --mpl-baseline-path
    ignore:Ignoring --mpl-baseline-path since --mpl-generate-path is set:UserWarning
