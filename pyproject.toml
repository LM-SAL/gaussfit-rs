[build-system]
requires = [
  "maturin>=1.8,<2.0",
]
build-backend = "maturin"

[project]
name = "gaussfit-rs"
version = "1.2.0"
description = "Rust backend for MUSE fast Gaussian fitting"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Nabil Freij", email = "nabil.freij@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
docs = [
  "sphinx>=8",
  "furo",
  "sphinx-copybutton",
]
tests = [
  "matplotlib>=3.11.0",
  "pytest",
  "pytest-mpl>=0.19.0",
]
dev = [
  "gaussfit-rs[tests,docs]",
]

[project.urls]
Source = "https://github.com/LM-SAL/gaussfit-rs"
Issues = "https://github.com/LM-SAL/gaussfit-rs/issues"
Documentation = "https://gaussfit-rs.readthedocs.io"

[tool.maturin]
python-source = "python"
module-name = "gaussfit_rs._gaussfit_rs"
# Keep the sdist to what a build needs: the patched rmpfit under third_party/ is a Cargo path
# dependency and must ship; the C reference is test-only and carries its own licenses.
exclude = [
  "third_party/c_reference/**",
  "benchmarks/**",
  "docs/**",
  ".circleci/**",
  ".github/**",
  ".gitignore",
  ".pre-commit-config.yaml",
  ".readthedocs.yaml",
  ".clippy.toml",
  "rustfmt.toml",
  "ruff.toml",
  "tox.ini",
]

[tool.pytest.ini_options]
testpaths = ["python/gaussfit_rs/tests"]
# Figure tests need --mpl and a pinned matplotlib; see the tox "figure" factor.
addopts = "-m 'not mpl_image_compare'"
mpl-results-path = "figure_test_images"
mpl-use-full-test-name = true
markers = [
  "mpl_image_compare: hash-verified matplotlib figure test, applied by gaussfit_rs.tests.helpers.figure_test",
]

[tool.gilesbot.circleci_artifacts.figure_report]
url = ".tmp/py313-figure/figure_test_images/fig_comparison.html"
message = "Click details to see the figure test comparisons, for py313-figure."

[tool.cibuildwheel]
build-frontend = "build"
skip = ["pp*", "*-win32", "*-manylinux_i686"]
test-extras = ["tests"]
test-command = "pytest --pyargs gaussfit_rs"

[tool.docformatter]
recursive = true
wrap-summaries = 100
wrap-descriptions = 100
pre-summary-newline = true
close-quotes-on-newline = true
make-summary-multi-line = true
black = true
