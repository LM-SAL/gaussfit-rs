[build-system]
requires = [
  "maturin>=1.8,<2.0",
]
build-backend = "maturin"

[project]
name = "gaussfit-rs"
dynamic = ["version"]  # taken from Cargo.toml by maturin
description = "Rust backend for MUSE fast Gaussian fitting"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Nabil Freij", email = "nabil.freij@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.3.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
docs = [
  "sphinx>=8.1.0",
  "furo>=2025.7.19",
  "sphinx-copybutton",
]
tests = [
  "matplotlib>=3.11.0",
  "pytest>=8.3.4",
  "pytest-doctestplus>=1.0.0",
  "pytest-mpl>=0.19.0",
]
dev = [
  "gaussfit-rs[tests,docs]",
]

[project.urls]
Source = "https://github.com/LM-SAL/gaussfit-rs"
Issues = "https://github.com/LM-SAL/gaussfit-rs/issues"
Documentation = "https://gaussfit-rs.readthedocs.io"

[tool.maturin]
python-source = "python"
module-name = "gaussfit_rs._gaussfit_rs"
# Keep the sdist to what a build needs: the patched rmpfit under third_party/ is a Cargo path
# dependency and must ship; the C reference is test-only and carries its own licenses.
exclude = [
  "third_party/c_reference/**",
  "benchmarks/**",
  "changelog/**",
  "docs/**",
  ".circleci/**",
  ".github/**",
  ".gitignore",
  ".pre-commit-config.yaml",
  ".readthedocs.yaml",
  "rustfmt.toml",
  "ruff.toml",
  "tox.ini",
  "pytest.ini",
  "AGENTS.md",
]

[tool.gilesbot.circleci_artifacts.figure_report]
url = ".tmp/py313-figure/figure_test_images/fig_comparison.html"
message = "Click details to see the figure test comparisons, for py313-figure."

[tool.cibuildwheel]
build-frontend = "build"
skip = ["*-win32", "*-manylinux_i686"]
test-extras = ["tests"]
test-command = "pytest --pyargs gaussfit_rs"

[tool.docformatter]
recursive = true
wrap-summaries = 100
wrap-descriptions = 100
pre-summary-newline = true
close-quotes-on-newline = true
make-summary-multi-line = true
black = true

[tool.towncrier]
package = "gaussfit_rs"
filename = "CHANGELOG.rst"
directory = "changelog/"
issue_format = "`#{issue} <https://github.com/LM-SAL/gaussfit-rs/pull/{issue}>`__"
title_format = "{version} ({project_date})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecation"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "trivial"
name = "Internal Changes"
showcontent = true
