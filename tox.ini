[tox]
min_version = 4
envlist =
    py{312,313,314}{,-figure}
    py313-cparity
    codestyle
    build_docs
isolated_build = true

[testenv]
package = wheel
wheel_build_env = .pkg
change_dir = .tmp/{envname}
description =
    run tests
    figure: runs the figure test suite against the committed hash library.
    cparity: runs tests against the pinned C extension and recorded fixtures.
allowlist_externals =
    /bin/sh
set_env =
    MPLBACKEND = agg
deps =
    # Figure hashes depend on the exact matplotlib (and bundled FreeType) build.
    figure: matplotlib==3.11.0
    cparity: {toxinidir}/third_party/c_reference
extras =
    tests
commands =
    pip freeze --all --no-input
    cparity: python -c "import gaussfit_c_reference.fit_single_spectrum_ext"
    figure: /bin/sh -c "mkdir -p ./figure_test_images; python -c 'import matplotlib as mpl; print(mpl.ft2font.__file__, mpl.ft2font.__freetype_version__, mpl.ft2font.__freetype_build_type__)' > ./figure_test_images/figure_version_info.txt"
    figure: /bin/sh -c "pip freeze >> ./figure_test_images/figure_version_info.txt"
    figure: /bin/sh -c "cat ./figure_test_images/figure_version_info.txt"
    figure: python -c "import gaussfit_rs.tests.helpers as h; print(h.get_hash_library_name())"
    pytest \
    -vvv \
    -r fEs \
    --pyargs gaussfit_rs \
    figure: -m "mpl_image_compare" \
    figure: --mpl \
    figure: --mpl-generate-summary=html \
    figure: --mpl-baseline-path=https://raw.githubusercontent.com/LM-SAL/figure-test-images/gaussfit-rs-main/figures/{envname}/ \
    {posargs}

[testenv:codestyle]
pypi_filter =
skip_install = true
description = Run all style and file checks with prek
deps =
    prek
commands =
    prek prepare-hooks --color always
    prek run --color always --all-files --show-diff-on-failure {posargs}

[testenv:build_docs]
changedir = docs
description = Invoke sphinx-build to build the HTML docs
extras =
    docs
allowlist_externals = sphinx-build
commands =
    pip freeze --all --no-input
    sphinx-build \
    -j auto \
    --color \
    -W \
    --keep-going \
    -b html \
    -d _build/.doctrees \
    . \
    _build/html \
    {posargs}
    python -c 'import pathlib; print("Documentation available under file://\{0\}".format(pathlib.Path(r"{toxinidir}") / "docs" / "_build" / "index.html"))'
