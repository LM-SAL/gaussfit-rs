[tox]
min_version = 4
envlist =
    py{312,313,314}
    codestyle
    build_docs
isolated_build = true

[testenv]
package = wheel
wheel_build_env = .pkg
change_dir = .tmp/{envname}
extras =
    tests
commands =
    pip freeze --all --no-input
    pytest \
    -vvv \
    -r fEs \
    --pyargs gaussfit_rs \
    {posargs}

[testenv:codestyle]
pypi_filter =
skip_install = true
description = Run all style and file checks with prek
deps =
    prek
commands =
    prek prepare-hooks --color always
    prek run --color always --all-files --show-diff-on-failure {posargs}

[testenv:build_docs]
changedir = docs
description = Invoke sphinx-build to build the HTML docs
extras =
    docs
allowlist_externals = sphinx-build
commands =
    pip freeze --all --no-input
    sphinx-build \
    -j auto \
    --color \
    -W \
    --keep-going \
    -b html \
    -d _build/.doctrees \
    . \
    _build/html \
    {posargs}
    python -c 'import pathlib; print("Documentation available under file://\{0\}".format(pathlib.Path(r"{toxinidir}") / "docs" / "_build" / "index.html"))'
