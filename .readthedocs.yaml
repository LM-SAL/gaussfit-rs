# Read the Docs configuration file.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.

version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.14"
  jobs:
    # rustup, as the newest build.tools.rust is older than the Rust that Cargo.toml requires.
    pre_install:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    # Replaces python.install; each command runs in a new shell, so cargo goes on PATH here.
    install:
      - PATH="$HOME/.cargo/bin:$PATH" python -m pip install ".[docs]"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
