version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.14"
  jobs:
    # The extension needs a newer Rust toolchain than the build image provides.
    pre_install:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    # Each command starts a new shell, so add Cargo to PATH for pip.
    install:
      - PATH="$HOME/.cargo/bin:$PATH" python -m pip install ".[docs]"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
