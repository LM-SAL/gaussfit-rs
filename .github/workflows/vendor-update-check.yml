name: Vendored dependency update check

# Vendored deps (see third_party/) are not tracked by cargo update / Dependabot.
# This job polls crates.io for a newer release of each vendored crate and opens
# a GitHub issue when one is found. The pinned version is read from the vendored
# crate's own Cargo.toml so there is a single source of truth.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  rmpfit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check crates.io for a newer rmpfit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          manifest="third_party/rmpfit/Cargo.toml"
          pinned=$(grep -m1 '^version' "$manifest" | sed -E 's/.*"([^"]+)".*/\1/')
          latest=$(curl -fsSL \
            -H 'User-Agent: gaussfit-rs vendor-update-check (https://github.com/LM-SAL/gaussfit-rs)' \
            https://crates.io/api/v1/crates/rmpfit | jq -r '.crate.max_stable_version')

          echo "pinned=$pinned latest=$latest"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::could not read latest version from crates.io"
            exit 1
          fi

          # Only act when crates.io is strictly newer than the pinned version.
          newest=$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)
          if [ "$latest" = "$pinned" ] || [ "$newest" != "$latest" ]; then
            echo "vendored rmpfit ($pinned) is up to date"
            exit 0
          fi

          title="Vendored rmpfit update available: $pinned -> $latest"
          existing=$(gh issue list --state open \
            --search 'in:title Vendored rmpfit update available' \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "update issue already open: #$existing"
            exit 0
          fi

          gh issue create --title "$title" --body "$(cat <<EOF
          crates.io has a newer release of the vendored \`rmpfit\` crate.

          - Pinned (vendored): \`$pinned\`
          - Latest on crates.io: \`$latest\`

          Follow the **How to update** steps in \`third_party/rmpfit/VENDORED.md\`,
          then re-run \`cargo test\` and the differential validation harness before
          merging.

          _Opened automatically by \`.github/workflows/vendor-update-check.yml\`._
          EOF
          )"
