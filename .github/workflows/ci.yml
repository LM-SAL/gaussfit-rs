name: CI

on:
  push:
    branches:
      - "main"
      - "*.*"
      - "!*backport*"
    tags:
      - "v*"
      - "!*dev*"
      - "!*pre*"
      - "!*post*"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 3"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test
  tests:
    # Every supported Python once and every platform once: the C-parity job needs Linux for
    # the pinned C extension, the newest Python goes on Linux too, the others on macOS and Windows.
    needs: [rust]
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@3a3dcf3ba6828dac29eba10334948ef38364ed14 # v3.1.0
    with:
      submodules: false
      toxdeps: tox-pypi-filter
      envs: |
        - linux: py313-cparity
        - linux: py315
        - macos: py314
        - windows: py312

  dist_check:
    # The sdist and wheel must carry metadata PyPI accepts: twine check --strict, the check the
    # publish action runs before uploading, runs here on every PR; check-wheel-contents catches
    # layout mistakes; installing from the sdist proves it ships the vendored rmpfit crate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Build the source distribution and a wheel from it
        run: |
          python -m pip install -U build twine check-wheel-contents
          python -m build .
      - name: Check metadata and wheel layout
        run: |
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
      - name: Install from the source distribution
        run: |
          python -m pip install dist/*.tar.gz
          python -c "import gaussfit_rs; print(gaussfit_rs.__version__)"

  docs:
    needs: [rust]
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@3a3dcf3ba6828dac29eba10334948ef38364ed14 # v3.1.0
    with:
      default_python: "3.14"
      submodules: false
      pytest: false
      toxdeps: tox-pypi-filter
      envs: |
        - linux: build_docs

  build_dists:
    # Twelve wheels with LTO: built for tags, and for a PR labelled "Run publish" to rehearse
    # a release, not on every push to main or the weekly schedule.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'Run publish')
      )
    needs: [tests, docs, dist_check]
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish.yml@3a3dcf3ba6828dac29eba10334948ef38364ed14 # v3.1.0
    with:
      sdist: true
      test_extras: "tests"
      test_command: "pytest -p no:warnings --pyargs gaussfit_rs"
      targets: |
        - cp3{12,13,14,15}-manylinux_x86_64
        - cp3{12,13,14,15}-macosx_arm64
        - cp3{12,13,14,15}-win_amd64
      submodules: false
      save_artifacts: true
      upload_to_pypi: false

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs: [build_dists]
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          pattern: dist-*
          path: dist
      - name: List artifacts
        run: ls -lha dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
